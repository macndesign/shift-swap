name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Reaproveitado pelo publish.yml: a mesma barra de qualidade vale para publicar.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # Falha se o bun.lock estiver desatualizado em vez de resolver versões novas.
      - run: bun install --frozen-lockfile

      - run: bun run lint

      # Type-check completo, incluindo os testes (o build:types exclui __tests__).
      - run: bun run typecheck

      # Bugs que compilam no uso do core-kernel (regras CK001–CK008 do core-kernel-check).
      - run: bun run check:ddd

      # Skills e agentes do core-kernel em .claude/ batem com a versão instalada (sem edições locais).
      - run: bun run check:skills

      # Falha se algum arquivo ficar abaixo da meta de cobertura do bunfig.toml.
      - run: bun run test:coverage

      - run: bun run build

      # Tipos publicados resolvem para consumidores Node ESM, Node CJS e bundlers.
      - run: bun run check:package
