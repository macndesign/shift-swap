name: Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  # Mesmas verificações do CI (lint, type-check, cobertura, build, attw) antes de publicar.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # criar a release no GitHub
      id-token: write # assinatura de provenance no npm
    steps:
      - uses: actions/checkout@v4

      - name: Conferir tag × versão do package.json
        run: |
          VERSAO=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${VERSAO}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} não bate com a versão ${VERSAO} do package.json"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - run: bun run build

      # npm em vez de `bun publish`: o Bun ainda não gera provenance (--provenance).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Só depois do npm: a release no GitHub existe apenas para versões de fato publicadas.
      # As notas partem da tag de versão imediatamente anterior (ordem semver), passada
      # explicitamente: sem isso, o GitHub escolhe a "release anterior" por heurística e
      # já errou (as notas da v0.6.3 saíram a partir da v0.4.0).
      - name: Criar release no GitHub
        run: |
          git fetch --tags --quiet
          ANTERIOR=$(git tag --list 'v*.*.*' --sort=-v:refname | grep -A1 -x "$GITHUB_REF_NAME" | sed -n 2p)
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "${GITHUB_REF_NAME#v}" \
            --generate-notes ${ANTERIOR:+--notes-start-tag "$ANTERIOR"}
        env:
          GH_TOKEN: ${{ github.token }}
